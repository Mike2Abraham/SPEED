    <style>
    /* Estilo para el botón de "no carga" */
    .btn-no-carga {
      background: #ff4444;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      transition: all 0.3s;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    .btn-no-carga:hover {
      background: #ff0000;
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.3);
    }
    .btn-no-carga:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="logo">
      <img src="../recursos/iconob.png" class="logotipo">
    </div>

    <div class="titulo">SPEED ELECTRONIC</div>
    <nav class="menu">
      <a href="../index.html"> <img class="icoE" src="../recursos/iconitos/casa.png">Casa</a>

      <!-- Modal de abrir donacion -->
      <div class="menu-item-contextual"> 
        <a href="./index-quejas.html"><img class="icoE" src="../recursos/iconitos/quejas.png">Quejas y Sugerencias</a> 
        <div class="menu-contextual">
          <button class="btn-contextual" onclick="ModalDonaciones.open()">💖 Donar</button>
        </div>
      </div>
      <a href="./index-acercaWEB.html"><img class="icoE" src="../recursos/iconitos/bolos.png">Acerca de Nosotros!</a>
    </nav>

    <!-- Botón hamburguesa (solo móvil) -->
    <button class="hamburger-btn" aria-label="Abrir menú">☰</button>
     <div class="cursor-light"></div> <!-- luz que sigue el mause-->
  </header>

  <!-- Menú lateral móvil (oculto por defecto) -->
  <div class="mobile-menu-overlay"></div>
  <nav class="mobile-menu">
    <button class="close-btn" aria-label="Cerrar menú">✖</button>
    <div class="menu-links">
      <a href="../index.html">🏠 Casa</a>

    </div>
    <img src="../recursos/sp2.png" class="menu-img">
  </nav>

  <button class="to-top-btn hidden" aria-label="Subir al inicio">↑</button>

  <main class="contenedor-descargas">
    <h1>Descargas para Windows</h1>
  </main>

  <div id="loader-tarjetas">
    <div class="spinner"></div>
    <p class="mensaje-loader">⏳ Espera... las tarjetas son tímidas dale su tiempo!</p>
    <p class="mensaje-loader">En caso de no salir en 1 min Recarga la pagina</p>
	<button class="btn-no-carga" id="btn-no-carga">¡SI NO CARGA PRESIONA AQUÍ!</button>
  </div>
  
  <!-- Script para el botón de "no carga" -->
  <script>
    document.getElementById('btn-no-carga').addEventListener('click', function() {
      document.getElementById('loader-tarjetas').style.display = 'none';
      
      // Opcional: Mostrar mensaje de que se ocultó
      const main = document.querySelector('main.contenedor-descargas');
      if (main) {
        const mensaje = document.createElement('p');
        mensaje.textContent = 'Se ocultó el cargador. Si necesitas verlo de nuevo, recarga la página.';
        mensaje.style.color = '#ff4444';
        mensaje.style.textAlign = 'center';
        mensaje.style.marginTop = '20px';
        main.appendChild(mensaje);
      }
    });
  </script>
